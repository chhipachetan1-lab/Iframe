<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background: linear-gradient(90deg , skyblue  , purple);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form{
            height: 80%;
            width: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color:white;
            border-radius: 10px;
        }
        label{
            font-size: 20x;
        }
        input {
            border: 1px solid gray;
            background-color: lightgrey;
            border-radius: 10px;
            height:50%;
            width: 100%;
            margin-top: 3%;
        }
        .email , .password , .login{
            height:20%;
            margin-top: 1%;
            /* border: 1px solid black; */
            width: 90%;
            margin:auto
        
        }
        h1{
            margin-top: 5%;
           
        }
        .password>p{
            margin-top: 3%;
            color: grey;
            font-style: italic;
        }
        login>p{
            margin-top: 5%;
        }
        #login{
            background: linear-gradient(90deg , skyblue  , purple);
            color: white;
            text-align: center;
        }
        a{
            text-decoration: none;
            color: black;
            font-style: italic;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">LOGIN FORM</h1>
        <div class="email">
            <label for="">Email or Phone</label>
            <input type="Email" placeholder="Abc@gamil.com">
        </div>
        <div class="password">
            <label for="">Password</label>
            <input type="password" placeholder="xyz2003">
            <p>Forgot Password?</p>
        </div>
        <div class="login">
            <input type="button" value="Login" id="login"> 
            <p align="center">Not a Member? <a href="Sign UP.html">Sign UP</a> </p>
        </div>
    </form>


</body>
</html>

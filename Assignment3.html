<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            background-color:orchid;
        }
        .header,footer{
            border: 1px white;
            height: 20%;
            background-color: blue;
        }
        .center{
            height:60% ;
            background-color:yellow ;
            display: flex;
        }
        .left{
            width: 20%;
            height:100% ;
            background-color:red;
        }
        .right{
            width: 80%;
            height:100% ;
            background-color:green ;
        }
        .top{
            height: 50%;
            background-color: rgba(rgb(7, 26, 23),.3);
        }
        .bottom{
            display: flex;
            height: 50%;
            background-color:rebeccapurple
        }
        .b1{
            height:100% ;
            width: 50%;
            background-color:purple
        }
        .b2{
            height:100% ;
            width: 50%;
            background-color: brown;
            display:flex
           
        }

    </style>
</head>
<body>
    <h1 align="center"> Flex Box</h1>
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="b1"></div>
                    <div class="b2"></div>
                </div>
            </div>
        </div>

        </div>
        <div class="footer"></div>
    </div>
    
</body>
</html>
